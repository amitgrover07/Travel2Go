name: Deploy Microservices to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'microservices/**'
      - '.github/workflows/backend-deploy.yml'

env:
  PROJECT_ID: travel2go-495007
  REGION: asia-south2

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity-service
            port: 8081
          - service: package-service
            port: 8082
          - service: booking-service
            port: 8083
          - service: media-service
            port: 8084
          - service: notification-service
            port: 8085
          - service: api-gateway
            port: 8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Build common-models
        run: cd microservices/common-models && ./mvnw clean install

      - name: Build Microservice
        run: cd microservices/${{ matrix.service }} && ./mvnw clean package -DskipTests

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${{ matrix.service }}:${{ github.sha }}
          cd microservices/${{ matrix.service }}
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Prepare Environment Variables
        run: |
          echo "FINAL_JWT_SECRET=${{ secrets.JWT_SECRET || 'placeholder' }}" >> $GITHUB_ENV
          echo "FINAL_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || 'placeholder' }}" >> $GITHUB_ENV
          echo "FINAL_GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || 'placeholder' }}" >> $GITHUB_ENV
          echo "FINAL_MAIL_USERNAME=${{ secrets.MAIL_USERNAME || 'placeholder' }}" >> $GITHUB_ENV
          echo "FINAL_MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD || 'placeholder' }}" >> $GITHUB_ENV
          echo "FINAL_TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID || 'placeholder' }}" >> $GITHUB_ENV
          echo "FINAL_TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN || 'placeholder' }}" >> $GITHUB_ENV
          echo "FINAL_TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER || 'placeholder' }}" >> $GITHUB_ENV
          
          # Service URLs
          if [ -z "${{ secrets.IDENTITY_SERVICE_URL }}" ]; then echo "FINAL_IDENTITY_URL=http://identity-tbd" >> $GITHUB_ENV; else echo "FINAL_IDENTITY_URL=${{ secrets.IDENTITY_SERVICE_URL }}" >> $GITHUB_ENV; fi
          if [ -z "${{ secrets.PACKAGE_SERVICE_URL }}" ]; then echo "FINAL_PACKAGE_URL=http://package-tbd" >> $GITHUB_ENV; else echo "FINAL_PACKAGE_URL=${{ secrets.PACKAGE_SERVICE_URL }}" >> $GITHUB_ENV; fi
          if [ -z "${{ secrets.BOOKING_SERVICE_URL }}" ]; then echo "FINAL_BOOKING_URL=http://booking-tbd" >> $GITHUB_ENV; else echo "FINAL_BOOKING_URL=${{ secrets.BOOKING_SERVICE_URL }}" >> $GITHUB_ENV; fi
          if [ -z "${{ secrets.MEDIA_SERVICE_URL }}" ]; then echo "FINAL_MEDIA_URL=http://media-tbd" >> $GITHUB_ENV; else echo "FINAL_MEDIA_URL=${{ secrets.MEDIA_SERVICE_URL }}" >> $GITHUB_ENV; fi
          if [ -z "${{ secrets.NOTIFICATION_SERVICE_URL }}" ]; then echo "FINAL_NOTIFICATION_URL=http://notification-tbd" >> $GITHUB_ENV; else echo "FINAL_NOTIFICATION_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}" >> $GITHUB_ENV; fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ matrix.service }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ matrix.service }}:${{ github.sha }}
          flags: "--port=${{ matrix.port }} --allow-unauthenticated"
          env_vars: |
            JWT_SECRET=${{ env.FINAL_JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ env.FINAL_GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ env.FINAL_GOOGLE_CLIENT_SECRET }}
            MAIL_USERNAME=${{ env.FINAL_MAIL_USERNAME }}
            MAIL_PASSWORD=${{ env.FINAL_MAIL_PASSWORD }}
            TWILIO_ACCOUNT_SID=${{ env.FINAL_TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ env.FINAL_TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ env.FINAL_TWILIO_PHONE_NUMBER }}
            OAUTH2_REDIRECT_URI=https://travel2go-495007.web.app/oauth2/redirect
            IDENTITY_SERVICE_URL=${{ env.FINAL_IDENTITY_URL }}
            PACKAGE_SERVICE_URL=${{ env.FINAL_PACKAGE_URL }}
            BOOKING_SERVICE_URL=${{ env.FINAL_BOOKING_URL }}
            MEDIA_SERVICE_URL=${{ env.FINAL_MEDIA_URL }}
            NOTIFICATION_SERVICE_URL=${{ env.FINAL_NOTIFICATION_URL }}
