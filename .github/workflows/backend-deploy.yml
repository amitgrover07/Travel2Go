name: Deploy Microservices to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'microservices/**'

env:
  PROJECT_ID: travel2go-495007
  REGION: asia-south2

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity-service
            port: 8081
          - service: package-service
            port: 8082
          - service: booking-service
            port: 8083
          - service: media-service
            port: 8084
          - service: notification-service
            port: 8085
          - service: api-gateway
            port: 8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Build common-models
        run: cd microservices/common-models && ./mvnw clean install

      - name: Build Microservice
        run: cd microservices/${{ matrix.service }} && ./mvnw clean package -DskipTests

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${{ matrix.service }}:${{ github.sha }}
          cd microservices/${{ matrix.service }}
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ matrix.service }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ matrix.service }}:${{ github.sha }}
          flags: "--port=${{ matrix.port }} --allow-unauthenticated"
          env_vars: |
            JWT_SECRET=${{ secrets.JWT_SECRET || 'placeholder' }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || 'placeholder' }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || 'placeholder' }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME || 'placeholder' }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD || 'placeholder' }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID || 'placeholder' }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN || 'placeholder' }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER || 'placeholder' }}
            OAUTH2_REDIRECT_URI=https://travel2go-495007.web.app/oauth2/redirect
            IDENTITY_SERVICE_URL=${{ secrets.IDENTITY_SERVICE_URL || 'http://identity-tbd' }}
            PACKAGE_SERVICE_URL=${{ secrets.PACKAGE_SERVICE_URL || 'http://package-tbd' }}
            BOOKING_SERVICE_URL=${{ secrets.BOOKING_SERVICE_URL || 'http://booking-tbd' }}
            MEDIA_SERVICE_URL=${{ secrets.MEDIA_SERVICE_URL || 'http://media-tbd' }}
            NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL || 'http://notification-tbd' }}
