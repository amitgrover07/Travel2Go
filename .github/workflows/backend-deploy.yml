name: Deploy Microservices to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'microservices/**'
      - '.github/workflows/backend-deploy.yml'

env:
  PROJECT_ID: travel2go-495007
  REGION: asia-south2

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity-service
          - service: package-service
          - service: booking-service
          - service: media-service
          - service: notification-service
          - service: api-gateway
          - service: reactive-booking-function
          - service: trip-service
          - service: payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Build shared modules (common-models, platform-security)
        run: |
          if [ -f "microservices/${{ matrix.service }}/pom.xml" ]; then
            cd microservices/common-models && ./mvnw clean install
            cd ../platform-security && ./mvnw clean install
          else
            echo "Non-Java service. Skipping shared-module build."
          fi

      - name: Build Microservice
        run: |
          if [ -f "microservices/${{ matrix.service }}/pom.xml" ]; then
            cd microservices/${{ matrix.service }} && ./mvnw clean package -DskipTests
          else
            echo "No pom.xml found. Skipping Maven build for ${{ matrix.service }}."
          fi

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${{ matrix.service }}:${{ github.sha }}
          cd microservices/${{ matrix.service }}
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Prepare Environment Variables
        shell: bash
        run: |
          set_env() {
            local name=$1
            local value=$2
            local default=$3
            if [ -z "$value" ]; then
              echo "$name=$default" >> $GITHUB_ENV
            else
              echo "$name=$value" >> $GITHUB_ENV
            fi
          }
          set_env "FINAL_JWT_SECRET" "${{ secrets.JWT_SECRET }}" "placeholder_secret"
          set_env "FINAL_GOOGLE_CLIENT_ID" "${{ secrets.GOOGLE_CLIENT_ID }}" "placeholder_client_id"
          set_env "FINAL_GOOGLE_CLIENT_SECRET" "${{ secrets.GOOGLE_CLIENT_SECRET }}" "placeholder_client_secret"
          set_env "FINAL_MAIL_USERNAME" "${{ secrets.MAIL_USERNAME }}" "placeholder_mail"
          set_env "FINAL_MAIL_PASSWORD" "${{ secrets.MAIL_PASSWORD }}" "placeholder_pass"
          set_env "FINAL_TWILIO_ACCOUNT_SID" "${{ secrets.TWILIO_ACCOUNT_SID }}" "placeholder_sid"
          set_env "FINAL_TWILIO_AUTH_TOKEN" "${{ secrets.TWILIO_AUTH_TOKEN }}" "placeholder_token"
          set_env "FINAL_TWILIO_PHONE_NUMBER" "${{ secrets.TWILIO_PHONE_NUMBER }}" "placeholder_phone"
          set_env "FINAL_IDENTITY_URL" "${{ secrets.IDENTITY_SERVICE_URL }}" "http://identity-tbd"
          set_env "FINAL_PACKAGE_URL" "${{ secrets.PACKAGE_SERVICE_URL }}" "http://package-tbd"
          set_env "FINAL_BOOKING_URL" "${{ secrets.BOOKING_SERVICE_URL }}" "http://booking-tbd"
          set_env "FINAL_MEDIA_URL" "${{ secrets.MEDIA_SERVICE_URL }}" "http://media-tbd"
          set_env "FINAL_NOTIFICATION_URL" "${{ secrets.NOTIFICATION_SERVICE_URL }}" "http://notification-tbd"
          set_env "FINAL_TRIP_URL" "${{ secrets.TRIP_SERVICE_URL }}" "http://trip-tbd"
          set_env "FINAL_PAYMENT_URL" "${{ secrets.PAYMENT_SERVICE_URL }}" "http://payment-tbd"
          set_env "FINAL_QUOTE_TOKEN_SECRET" "${{ secrets.QUOTE_TOKEN_SECRET }}" "placeholder_secret"
          set_env "FINAL_RAZORPAY_KEY_ID" "${{ secrets.RAZORPAY_KEY_ID }}" "placeholder_key_id"
          set_env "FINAL_RAZORPAY_KEY_SECRET" "${{ secrets.RAZORPAY_KEY_SECRET }}" "placeholder_secret"
          set_env "FINAL_RAZORPAY_WEBHOOK_SECRET" "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" "placeholder_secret"
          set_env "FINAL_REDIS_HOST" "${{ secrets.SPRING_REDIS_HOST }}" "localhost"
          set_env "FINAL_REDIS_PORT" "${{ secrets.SPRING_REDIS_PORT }}" "6379"
          set_env "FINAL_REDIS_PASSWORD" "${{ secrets.SPRING_REDIS_PASSWORD }}" "none"
          set_env "FINAL_REDIS_SSL_ENABLED" "${{ secrets.SPRING_REDIS_SSL_ENABLED }}" "false"
          set_env "FINAL_RABBITMQ_HOST" "${{ secrets.SPRING_RABBITMQ_HOST }}" "localhost"
          set_env "FINAL_RABBITMQ_PORT" "${{ secrets.SPRING_RABBITMQ_PORT }}" "5672"
          set_env "FINAL_RABBITMQ_USERNAME" "${{ secrets.SPRING_RABBITMQ_USERNAME }}" "guest"
          set_env "FINAL_RABBITMQ_PASSWORD" "${{ secrets.SPRING_RABBITMQ_PASSWORD }}" "guest"
          set_env "FINAL_RABBITMQ_SSL_ENABLED" "${{ secrets.SPRING_RABBITMQ_SSL_ENABLED }}" "false"
          if [ -n "${{ secrets.SPRING_RABBITMQ_VIRTUAL_HOST }}" ]; then
            set_env "FINAL_RABBITMQ_VIRTUAL_HOST" "${{ secrets.SPRING_RABBITMQ_VIRTUAL_HOST }}" "/"
          elif [ -n "${{ secrets.SPRING_RABBITMQ_USERNAME }}" ]; then
            set_env "FINAL_RABBITMQ_VIRTUAL_HOST" "${{ secrets.SPRING_RABBITMQ_USERNAME }}" "/"
          else
            set_env "FINAL_RABBITMQ_VIRTUAL_HOST" "" "/"
          fi

      - name: Build service-scoped env vars
        shell: bash
        run: |
          # A3: each service receives ONLY the env vars it actually consumes,
          # determined from its ${...} references and its pom starters. This
          # replaces the previous block that emitted every secret to every
          # service. Integration secrets keep their :placeholder property
          # defaults, so a service that doesn't get one falls back harmlessly.
          SVC="${{ matrix.service }}"
          {
            echo "CR_ENV_VARS<<ENVVARS_EOF"

            # JWT_SECRET -> the 6 services that depend on platform-security (JwtUtil).
            # These have no property default and fail fast under 32 bytes, so the
            # real secret is mandatory here.
            case "$SVC" in
              identity-service|package-service|booking-service|media-service|trip-service|payment-service)
                echo "JWT_SECRET=${FINAL_JWT_SECRET}" ;;
            esac

            # QUOTE_TOKEN_SECRET -> only the two services that sign/verify quote tokens.
            case "$SVC" in
              trip-service|payment-service)
                echo "QUOTE_TOKEN_SECRET=${FINAL_QUOTE_TOKEN_SECRET}" ;;
            esac

            # RAZORPAY_* -> payment-service only (order creation + webhook verification).
            case "$SVC" in
              payment-service)
                echo "RAZORPAY_KEY_ID=${FINAL_RAZORPAY_KEY_ID}"
                echo "RAZORPAY_KEY_SECRET=${FINAL_RAZORPAY_KEY_SECRET}"
                echo "RAZORPAY_WEBHOOK_SECRET=${FINAL_RAZORPAY_WEBHOOK_SECRET}" ;;
            esac

            # Google OAuth -> only services with the oauth2-client starter.
            case "$SVC" in
              identity-service|booking-service|notification-service)
                echo "GOOGLE_CLIENT_ID=${FINAL_GOOGLE_CLIENT_ID}"
                echo "GOOGLE_CLIENT_SECRET=${FINAL_GOOGLE_CLIENT_SECRET}" ;;
            esac

            # OAUTH2_REDIRECT_URI is a non-secret; give it to every service whose
            # config references it.
            case "$SVC" in
              identity-service|package-service|booking-service|media-service|notification-service)
                echo "OAUTH2_REDIRECT_URI=https://travel2go.in/oauth2/redirect" ;;
            esac

            # Mail -> only services with the mail starter.
            case "$SVC" in
              booking-service|notification-service)
                echo "MAIL_USERNAME=${FINAL_MAIL_USERNAME}"
                echo "MAIL_PASSWORD=${FINAL_MAIL_PASSWORD}" ;;
            esac

            # Twilio -> only services with the twilio starter.
            case "$SVC" in
              identity-service|booking-service|notification-service)
                echo "TWILIO_ACCOUNT_SID=${FINAL_TWILIO_ACCOUNT_SID}"
                echo "TWILIO_AUTH_TOKEN=${FINAL_TWILIO_AUTH_TOKEN}"
                echo "TWILIO_PHONE_NUMBER=${FINAL_TWILIO_PHONE_NUMBER}" ;;
            esac

            # Inter-service URLs -> only the caller of each downstream (Feign clients
            # / gateway routes). api-gateway fronts all; booking calls
            # identity/package/notification; identity calls notification; trip calls booking.
            case "$SVC" in
              api-gateway)
                echo "IDENTITY_SERVICE_URL=${FINAL_IDENTITY_URL}"
                echo "PACKAGE_SERVICE_URL=${FINAL_PACKAGE_URL}"
                echo "BOOKING_SERVICE_URL=${FINAL_BOOKING_URL}"
                echo "MEDIA_SERVICE_URL=${FINAL_MEDIA_URL}"
                echo "TRIP_SERVICE_URL=${FINAL_TRIP_URL}"
                echo "PAYMENT_SERVICE_URL=${FINAL_PAYMENT_URL}" ;;
              booking-service)
                echo "IDENTITY_SERVICE_URL=${FINAL_IDENTITY_URL}"
                echo "PACKAGE_SERVICE_URL=${FINAL_PACKAGE_URL}"
                echo "NOTIFICATION_SERVICE_URL=${FINAL_NOTIFICATION_URL}" ;;
              identity-service)
                echo "NOTIFICATION_SERVICE_URL=${FINAL_NOTIFICATION_URL}" ;;
              trip-service)
                echo "BOOKING_SERVICE_URL=${FINAL_BOOKING_URL}" ;;
            esac

            # RabbitMQ -> only services with the amqp starter.
            case "$SVC" in
              booking-service|trip-service|reactive-booking-function|payment-service)
                echo "SPRING_RABBITMQ_HOST=${FINAL_RABBITMQ_HOST}"
                echo "SPRING_RABBITMQ_PORT=${FINAL_RABBITMQ_PORT}"
                echo "SPRING_RABBITMQ_USERNAME=${FINAL_RABBITMQ_USERNAME}"
                echo "SPRING_RABBITMQ_PASSWORD=${FINAL_RABBITMQ_PASSWORD}"
                echo "SPRING_RABBITMQ_SSL_ENABLED=${FINAL_RABBITMQ_SSL_ENABLED}"
                echo "SPRING_RABBITMQ_VIRTUAL_HOST=${FINAL_RABBITMQ_VIRTUAL_HOST}" ;;
            esac

            # Redis -> only the reactive function has the redis starter.
            case "$SVC" in
              reactive-booking-function)
                echo "SPRING_REDIS_HOST=${FINAL_REDIS_HOST}"
                echo "SPRING_REDIS_PORT=${FINAL_REDIS_PORT}"
                echo "SPRING_REDIS_PASSWORD=${FINAL_REDIS_PASSWORD}"
                echo "SPRING_REDIS_SSL_ENABLED=${FINAL_REDIS_SSL_ENABLED}" ;;
            esac

            echo "ENVVARS_EOF"
          } >> "$GITHUB_ENV"

      - name: Set Cloud Run flags per service
        shell: bash
        run: |
          SVC="${{ matrix.service }}"

          # A4: run each service as its own dedicated SA (created by
          # infra/terraform), not the shared default compute SA.
          case "$SVC" in
            identity-service)             SA_ID=t2g-identity ;;
            package-service)              SA_ID=t2g-package ;;
            booking-service)              SA_ID=t2g-booking ;;
            media-service)                SA_ID=t2g-media ;;
            notification-service)         SA_ID=t2g-notification ;;
            trip-service)                 SA_ID=t2g-trip ;;
            payment-service)              SA_ID=t2g-payment ;;
            api-gateway)                  SA_ID=t2g-gateway ;;
            reactive-booking-function)    SA_ID=t2g-reactive ;;
          esac
          RUN_SA="--service-account=${SA_ID}@${PROJECT_ID}.iam.gserviceaccount.com"

          # B6: startup probe on /actuator/health/readiness, only for services that
          # expose it (booking, trip, identity, gateway). A service takes traffic
          # only once ready. NOTE: verify this flag syntax against your deploy-cloudrun
          # action / gcloud version; if it is rejected, drop STARTUP_PROBE here and set
          # it out-of-band with:
          #   gcloud run services update <svc> --region=$REGION \
          #     --startup-probe=httpGet.path=/actuator/health/readiness,httpGet.port=8080,initialDelaySeconds=10,periodSeconds=5,failureThreshold=12,timeoutSeconds=3
          case "$SVC" in
            booking-service|trip-service|identity-service|api-gateway)
              STARTUP_PROBE="--startup-probe=httpGet.path=/actuator/health/readiness,httpGet.port=8080,initialDelaySeconds=10,periodSeconds=5,failureThreshold=12,timeoutSeconds=3" ;;
            *)
              STARTUP_PROBE="" ;;
          esac

          if [ "$SVC" = "api-gateway" ]; then
            echo "CR_FLAGS=--port=8080 --allow-unauthenticated --min-instances=1 --max-instances=3 --concurrency=80 --timeout=60 ${RUN_SA} ${STARTUP_PROBE}" >> $GITHUB_ENV
          elif [ "$SVC" = "trip-service" ] || [ "$SVC" = "payment-service" ] || [ "$SVC" = "booking-service" ]; then
            # Internal-only (--no-allow-unauthenticated). Combined with the
            # per-caller run.invoker bindings in infra/terraform/run-invoker.tf,
            # this now gives true isolation: only the intended caller SAs can
            # invoke these, not "any workload in the project".
            echo "CR_FLAGS=--port=8080 --no-allow-unauthenticated --min-instances=0 --max-instances=3 --concurrency=80 --timeout=300 --cpu-boost ${RUN_SA} ${STARTUP_PROBE}" >> $GITHUB_ENV
          else
            echo "CR_FLAGS=--port=8080 --allow-unauthenticated --min-instances=0 --max-instances=3 --concurrency=80 --timeout=300 --cpu-boost ${RUN_SA} ${STARTUP_PROBE}" >> $GITHUB_ENV
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ matrix.service }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ matrix.service }}:${{ github.sha }}
          flags: ${{ env.CR_FLAGS }}
          env_vars: ${{ env.CR_ENV_VARS }}

      # A4: the old ad-hoc "Restrict invoker" step was removed. It bound the shared
      # default compute SA, which (its own note admitted) narrowed callers only to
      # "any workload in the project," not the real caller. Per-caller run.invoker
      # bindings are now declared in infra/terraform/run-invoker.tf:
      #   trip    <- gateway ;  booking <- gateway, trip ;  payment <- gateway
      # Run `terraform apply` after a deploy has created the services (see
      # infra/terraform/README.md).
