<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Stylized Arch/Path -->
    <path d="M10 50 C 10 20, 50 20, 50 50" stroke="url(#blueGrad)" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M20 55 C 20 35, 40 35, 40 55" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
    
    <!-- Airplane -->
    <g transform="translate(45, 15) rotate(-10)">
      <path d="M0 10 L15 0 L20 2 L15 10 L25 18 L20 22 L10 15 L0 18 Z" fill="#2563eb" filter="url(#shadow)" />
    </g>
    
    <!-- Location Pin -->
    <g transform="translate(30, 35)">
      <path d="M0 0 C -4 -4, -4 -10, 0 -10 C 4 -10, 4 -4, 0 0 Z" fill="#ef4444" />
      <circle cx="0" cy="-7" r="1.5" fill="white" />
    </g>
  </g>

  <!-- Brand Name -->
  <text x="85" y="55" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="-1">
    <tspan fill="#2563eb">Travel2Go</tspan>
    <tspan fill="#64748b" font-weight="400">.in</tspan>
  </text>
  
  <!-- Subtle tagline (larger than before) -->
  <text x="87" y="72" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" letter-spacing="1">YOUR JOURNEY, MADE EASY</text>
</svg>
