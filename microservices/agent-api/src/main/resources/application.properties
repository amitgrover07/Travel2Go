spring.application.name=agent-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Quote-token (G2): identical secret/format to trip-service, so agent quotes
#     re-validate server-side exactly like first-party bookings. ---
quote.token.secret=${QUOTE_TOKEN_SECRET}
quote.token.ttl-ms=900000

# --- Downstream services composed by the facade (never exposed directly) ---
agent.clients.waitlist-url=${WAITLIST_SERVICE_URL:http://localhost:8086}
agent.clients.booking-url=${BOOKING_SERVICE_URL:http://localhost:8083}

# --- Agent API keys + scopes (configure via env / secret manager in real envs).
#     Example local keys; override agent.api.keys[*] in production. ---
agent.api.keys[0].id=${AGENT_KEY0_ID:local-read-agent}
agent.api.keys[0].key=${AGENT_KEY0_VALUE:local-read-key}
agent.api.keys[0].scopes=read
agent.api.keys[1].id=${AGENT_KEY1_ID:local-book-agent}
agent.api.keys[1].key=${AGENT_KEY1_VALUE:local-book-key}
agent.api.keys[1].scopes[0]=read
agent.api.keys[1].scopes[1]=book

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Feign resilience: timeouts + per-client circuit breakers (matches the fleet) ---
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=5000
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.configs.default.timeout-duration=15s
