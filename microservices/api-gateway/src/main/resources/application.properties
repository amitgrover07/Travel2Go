spring.application.name=api-gateway
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.max-http-header-size=64KB

spring.cloud.gateway.x-forwarded.host-enabled=true
spring.cloud.gateway.x-forwarded.proto-enabled=true
spring.cloud.gateway.x-forwarded.for-enabled=true
spring.cloud.gateway.requests.preserve-host-header=true
# Spring Cloud Gateway Routes
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=${IDENTITY_SERVICE_URL}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/settings/**,/oauth2/**,/login/**,/login/oauth2/**

spring.cloud.gateway.routes[1].id=package-service
spring.cloud.gateway.routes[1].uri=${PACKAGE_SERVICE_URL}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/packages/**
 
spring.cloud.gateway.routes[2].id=custom-package-service
spring.cloud.gateway.routes[2].uri=${PACKAGE_SERVICE_URL}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/custom-packages/**
 
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=${BOOKING_SERVICE_URL}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.routes[4].id=media-service
spring.cloud.gateway.routes[4].uri=${MEDIA_SERVICE_URL}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/media/**

spring.cloud.gateway.routes[5].id=configurator-service
spring.cloud.gateway.routes[5].uri=${PACKAGE_SERVICE_URL}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/configurators/**

spring.cloud.gateway.routes[6].id=configurator-categories-service
spring.cloud.gateway.routes[6].uri=${PACKAGE_SERVICE_URL}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/configurator-categories/**

spring.cloud.gateway.routes[7].id=allocation-rules-service
spring.cloud.gateway.routes[7].uri=${PACKAGE_SERVICE_URL}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/allocation-rules/**

spring.cloud.gateway.routes[8].id=trip-service
spring.cloud.gateway.routes[8].uri=${TRIP_SERVICE_URL}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/trips/**

spring.cloud.gateway.routes[9].id=payment-webhook
spring.cloud.gateway.routes[9].uri=${PAYMENT_SERVICE_URL}
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/payments/webhook

# payment-service is otherwise internal-only (--no-allow-unauthenticated, see
# A4 / infra/terraform/run-invoker.tf); only the webhook path above is fronted
# by the gateway so Razorpay's callback (which carries no GCP identity) can
# reach it. Order/status/refund calls are not gateway-routed yet - they go
# through trip-service service-to-service once that orchestration lands (P1.2+).

# Logging Configuration
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.http.server.reactive=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.com.travel2go=DEBUG

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# --- Actuator readiness probes (B6): keeps the existing exposure above (incl. prometheus) ---
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState
