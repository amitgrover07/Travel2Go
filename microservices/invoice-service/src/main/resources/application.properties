spring.application.name=invoice-service
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# --- GST / seller details (F7) ---
invoice.seller.gstin=${INVOICE_SELLER_GSTIN:07AAAAA0000A1Z5}
invoice.seller.state-code=${INVOICE_SELLER_STATE_CODE:07}
invoice.gst.rate-bps=${INVOICE_GST_RATE_BPS:500}
invoice.hsn-sac=${INVOICE_HSN_SAC:9964}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
