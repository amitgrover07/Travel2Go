spring.application.name=waitlist-service
server.port=${PORT:8080}
# Trust X-Forwarded-For only from configured internal proxies (not from arbitrary clients),
# so the per-IP rate limit cannot be bypassed by forging the header.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=${WAITLIST_TRUSTED_PROXIES:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.1[6-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.2[0-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.3[0-1]\\.\\d{1,3}\\.\\d{1,3}}
spring.cloud.gcp.firestore.project-id=${PROJECT_ID:travel2go-495007}
spring.cloud.gcp.firestore.database-id=travel2go-db

# --- Public Waitlist Checker (F1) ---
waitlist.share.base-url=${WAITLIST_SHARE_BASE_URL:https://travel2go.in/waitlist}
# Required, no insecure default: a keyed HMAC secret (>= 32 bytes) for pseudonymising the source IP.
waitlist.ip-hash.secret=${WAITLIST_IP_HASH_SECRET}
waitlist.ratelimit.max-requests=${WAITLIST_RATELIMIT_MAX:20}
waitlist.ratelimit.window-seconds=${WAITLIST_RATELIMIT_WINDOW_SECONDS:60}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- Resilience4j: ready to guard any future external waitlist data source ---
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.configs.default.timeout-duration=15s
