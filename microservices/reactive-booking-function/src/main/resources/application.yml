server:
  port: ${PORT:8080}

spring:
  application:
    name: reactive-booking-function
  
  # Redis Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:false}

  # RabbitMQ Configuration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        auto-startup: false
        acknowledge-mode: manual
      direct:
        auto-startup: false
    admin:
      auto-startup: false

# Custom Business Properties
app:
  rabbitmq:
    exchange: booking.exchange
    queue: booking.events.queue
    routing-key: booking.initiated
    processed-routing-key: booking.processed
