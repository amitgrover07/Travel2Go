spring.application.name=payment-service
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# common-models still transitively carries spring-cloud-gcp-starter-data-firestore,
# which pulls in spring-cloud-gcp-autoconfigure. Combined with the postgres-socket-factory
# / postgresql driver added above, its CloudSqlEnvironmentPostProcessor auto-activates
# and fails fast (no spring.cloud.gcp.sql.database-name configured) unless disabled here -
# this service connects via a plain JDBC URL, not the Cloud SQL Spring integration.
spring.cloud.gcp.sql.enabled=false

# Same transitive-dependency conflict as above: Firestore's auto-config registers a
# ReactiveFirestoreTransactionManager bean (which implements the common TransactionManager
# marker interface) BEFORE Spring's JPA TransactionAutoConfiguration runs, so JPA's own
# @ConditionalOnMissingBean(TransactionManager.class) guard is satisfied first and the real
# JPA transactionManager bean never gets created - breaking every @Transactional method.
spring.cloud.gcp.firestore.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

quote.token.secret=${QUOTE_TOKEN_SECRET}
quote.token.ttl-ms=900000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

payment.provider=razorpay

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
