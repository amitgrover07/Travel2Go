spring.application.name=payment-service
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

quote.token.secret=${QUOTE_TOKEN_SECRET}
quote.token.ttl-ms=900000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

payment.provider=razorpay

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# --- F3 Refund SLA engine ---
# Low-float alert threshold (paise). Default ~0.36 cr; strategy targets a ~1.8 cr float.
payment.refund-float.low-threshold-paise=${REFUND_FLOAT_LOW_THRESHOLD_PAISE:360000000}
# How often the SLA breach sweep runs (ms).
payment.refund-sla.check-interval-ms=${REFUND_SLA_CHECK_INTERVAL_MS:60000}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
