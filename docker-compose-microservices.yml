version: '3.8'

services:
  api-gateway:
    build: ./microservices/api-gateway
    ports:
      - "8080:8080"
    networks:
      - travel2go-network
    depends_on:
      - identity-service
      - package-service
      - booking-service
      - media-service
      - notification-service
      - trip-service
    environment:
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - PACKAGE_SERVICE_URL=http://package-service:8082
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - MEDIA_SERVICE_URL=http://media-service:8084
      - TRIP_SERVICE_URL=http://trip-service:8087

  identity-service:
    build: ./microservices/identity-service
    ports:
      - "8081:8081"
    networks:
      - travel2go-network
    environment:
      - SERVER_PORT=8081
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085

  package-service:
    build: ./microservices/package-service
    ports:
      - "8082:8082"
    networks:
      - travel2go-network
    environment:
      - SERVER_PORT=8082

  booking-service:
    build: ./microservices/booking-service
    ports:
      - "8083:8083"
    networks:
      - travel2go-network
    environment:
      - SERVER_PORT=8083
      - PACKAGE_SERVICE_URL=http://package-service:8082
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq

  media-service:
    build: ./microservices/media-service
    ports:
      - "8084:8084"
    networks:
      - travel2go-network
    environment:
      - SERVER_PORT=8084

  notification-service:
    build: ./microservices/notification-service
    ports:
      - "8085:8085"
    networks:
      - travel2go-network
    environment:
      - SERVER_PORT=8085

  trip-service:
    build: ./microservices/trip-service
    ports:
      - "8087:8087"
    networks:
      - travel2go-network
    depends_on:
      - rabbitmq
      - booking-service
    environment:
      - SERVER_PORT=8087
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - SPRING_RABBITMQ_HOST=rabbitmq

  payment-service:
    build: ./microservices/payment-service
    ports:
      - "8088:8088"
    networks:
      - travel2go-network
    environment:
      - SERVER_PORT=8088

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - travel2go-network
    depends_on:
      - api-gateway

  redis:
    image: redis:alpine
    container_name: travel2go-redis
    ports:
      - "6379:6379"
    networks:
      - travel2go-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: travel2go-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - travel2go-network

  reactive-booking-function:
    build: ./microservices/reactive-booking-function
    ports:
      - "8086:8080"
    networks:
      - travel2go-network
    depends_on:
      - redis
      - rabbitmq
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq

networks:
  travel2go-network:
    driver: bridge
